<body><main>
<div class="top"><strong>CISSP 練習クイズ</strong><span id="count"></span></div>
<label for="domain" class="source">出題範囲</label><select id="domain" class="selector" aria-label="出題範囲"></select>

<button class="primary" id="startTest" type="button">全ドメイン混合テスト（80問）を始める</button>
<button class="secondary hidden" id="resumeTest" type="button">保存したテストを再開</button>
<div class="bar" aria-label="進捗"><span id="progress"></span></div><section class="card" id="quiz" aria-live="polite"></section>
<p class="foot">各ドメイン100問、計800問。各ドメイン10テーマを異なる業種・システムのケースで反復する形式です。書籍の設問・選択肢・解説は転載していません。ドメイン構成は<a href="https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline" target="_blank" rel="noreferrer">ISC2公式アウトライン</a>を参照しています。問題は学習用のオリジナル問題で、公式問題ではありません。</p>
</main>

const sel=document.querySelector('#domain'),area=document.querySelector('#quiz'),count=document.querySelector('#count'),progress=document.querySelector('#progress'),reviewWrong=document.querySelector('#reviewWrong'),startTestButton=document.querySelector('#startTest'),resumeTestButton=document.querySelector('#resumeTest');
sel.innerHTML='<option value="all">全ドメイン混合（800問）</option>'+domains.map((d,i)=>`<option value="${i}">${d.name}（100問）</option>`).join('');
let items=[],i=0,score=0,correctByDomain=[],reviewMode=false,testMode=false,testAnswers=[];
const missedKey='cissp-missed-v1';
const testKey='cissp-exam-v1';
function getMissed(){try{return JSON.parse(localStorage.getItem(missedKey)||'[]')}catch{return[]}}
function saveMissed(ids){try{localStorage.setItem(missedKey,JSON.stringify([...ids]))}catch{}updateReviewButton()}
function updateReviewButton(){const n=getMissed().length;reviewWrong.textContent=`間違えた問題を復習（${n}問）`;reviewWrong.disabled=n===0}
function getSavedTest(){try{const s=JSON.parse(localStorage.getItem(testKey)||'null');return s&&Array.isArray(s.ids)&&s.ids.length===80?s:null}catch{return null}}
function updateResumeButton(){resumeTestButton.classList.toggle('hidden',!getSavedTest())}
function saveTest(){if(!testMode)return;try{localStorage.setItem(testKey,JSON.stringify({ids:items.map(x=>x.id),answers:testAnswers,index:i}))}catch{}updateResumeButton()}
function allItems(){return domains.flatMap((_,di)=>makeItems(di))}
function shuffle(list){const a=[...list];for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}
function buildTest(){return shuffle(domains.flatMap((_,di)=>shuffle(makeItems(di)).slice(0,10)))}
function makeItems(domainIndex){const d=domains[domainIndex],out=[];d.seeds.forEach((s,si)=>d.scenes.forEach((scene,ci)=>{const q=`${scene}で${contexts[domainIndex][ci]}、${s.q}`;let opts=[{text:s.a,ok:true},...s.w.map(text=>({text,ok:false}))];const shift=(si+ci)%4;opts=opts.slice(shift).concat(opts.slice(0,shift));out.push({domain:d.name,topic:s.t,q,opts,why:s.e,id:`${domainIndex}:${si}:${ci}`})}));return out}
function start(itemsToUse,isReview=false){items=itemsToUse;i=0;score=0;reviewMode=isReview;correctByDomain=domains.map(d=>({name:d.name,correct:0,total:0}));if(items.length)render();else{count.textContent='0 / 0';progress.style.width='0';area.innerHTML='<div class="result"><h1>復習する問題はありません</h1><p>不正解の問題はすべて解き直せています。</p></div>'}updateReviewButton()}
function load(){const v=sel.value;let next=v==='all'?domains.flatMap((_,di)=>makeItems(di)):makeItems(Number(v));if(v==='all')next.sort(()=>Math.random()-.5);start(next)}
function loadWrong(){const missed=new Set(getMissed()),all=domains.flatMap((_,di)=>makeItems(di));start(all.filter(x=>missed.has(x.id)),true)}
function startTest(itemsToUse,answers=[],index=0){items=itemsToUse;i=Math.max(0,Math.min(index,items.length-1));score=0;reviewMode=false;testMode=true;testAnswers=items.map((_,n)=>Number.isInteger(answers[n])?answers[n]:null);correctByDomain=domains.map(d=>({name:d.name,correct:0,total:0}));saveTest();render()}
function beginTest(){startTest(buildTest())}
function resumeTest(){const saved=getSavedTest();if(!saved)return;const map=new Map(allItems().map(x=>[x.id,x])),restored=saved.ids.map(id=>map.get(id));if(restored.some(x=>!x)){localStorage.removeItem(testKey);updateResumeButton();return}startTest(restored,saved.answers,saved.index)}
function exitTest(){saveTest();testMode=false;area.innerHTML='<div class="result"><span class="tag">途中保存しました</span><h1>テストを保存しました</h1><p>続きは「保存したテストを再開」から再開できます。</p><button class="primary" id="resumeNow">テストを再開</button></div>';count.textContent=`${i+1} / ${items.length}`;progress.style.width=`${i/items.length*100}%`;area.querySelector('#resumeNow').addEventListener('click',resumeTest);updateResumeButton()}
function render(){const x=items[i];count.textContent=`${i+1} / ${items.length}`;progress.style.width=`${i/items.length*100}%`;if(testMode){const selected=testAnswers[i];area.innerHTML=`<span class="tag">全ドメイン混合テスト｜${x.domain}</span><h1>${x.q}</h1><fieldset><legend>最も適切なものを1つ選んでください</legend>${x.opts.map((o,j)=>`<label class="choice"><input type="radio" name="ans" value="${j}" ${selected===j?'checked':''}><span>${o.text}</span></label>`).join('')}</fieldset><button class="primary" id="nextTest">${i===items.length-1?'採点して結果を見る':'次の問題へ'}</button><button class="secondary" id="saveAndExit">途中保存して終了</button>`;area.querySelectorAll('input').forEach(e=>e.addEventListener('change',()=>{testAnswers[i]=Number(e.value);saveTest()}));area.querySelector('#nextTest').addEventListener('click',()=>{if(i<items.length-1){i++;saveTest();render()}else finishTest()});area.querySelector('#saveAndExit').addEventListener('click',exitTest);return}area.innerHTML=`<span class="tag">${reviewMode?'不正解の復習｜':''}${x.domain}｜${x.topic}</span><h1>${x.q}</h1><fieldset><legend>最も適切なものを1つ選んでください</legend>${x.opts.map((o,j)=>`<label class="choice"><input type="radio" name="ans" value="${j}"><span>${o.text}</span></label>`).join('')}</fieldset><button class="primary" id="check" disabled>回答する</button><div id="feedback" class="feedback hidden" role="status"></div><button class="secondary hidden" id="next">${i===items.length-1?'結果を見る':'次の問題へ'}</button>`;area.querySelectorAll('input').forEach(e=>e.addEventListener('change',()=>area.querySelector('#check').disabled=false));area.querySelector('#check').addEventListener('click',()=>{const n=Number(area.querySelector('input:checked').value),ok=x.opts[n].ok,missed=new Set(getMissed());if(ok){score++;missed.delete(x.id)}else missed.add(x.id);saveMissed(missed);const r=correctByDomain.find(d=>d.name===x.domain);r.total++;if(ok)r.correct++;const box=area.querySelector('#feedback');box.className='feedback '+(ok?'good':'bad');box.innerHTML=`<strong>${ok?'正解です':'不正解です'}｜正解：${x.opts.find(o=>o.ok).text}</strong>${x.why}`;area.querySelectorAll('input').forEach(e=>e.disabled=true);area.querySelector('#check').classList.add('hidden');area.querySelector('#next').classList.remove('hidden')});area.querySelector('#next').addEventListener('click',()=>{if(i<items.length-1){i++;render()}else finish()})}
function finishTest(){const missed=new Set(getMissed()),rows=[];score=0;correctByDomain=domains.map(d=>({name:d.name,correct:0,total:0}));items.forEach((x,n)=>{const answer=testAnswers[n],ok=answer!==null&&x.opts[answer]?.ok,r=correctByDomain.find(d=>d.name===x.domain);r.total++;if(ok){score++;missed.delete(x.id)}else{missed.add(x.id);rows.push(`<li><strong>${x.domain}｜${x.topic}</strong><br>${x.q}<br>正解：${x.opts.find(o=>o.ok).text}<br>${x.why}</li>`)}});saveMissed(missed);localStorage.removeItem(testKey);testMode=false;updateResumeButton();progress.style.width='100%';count.textContent=`${items.length} / ${items.length}`;const domainRows=correctByDomain.map(x=>`<li><span>${x.name}</span><strong>${x.correct} / ${x.total}</strong></li>`).join('');area.innerHTML=`<div class="result"><span class="tag">80問テスト完了</span><h1>テスト結果</h1><div class="score">${score} / ${items.length}</div><p>分野別の結果です。未回答は不正解として集計しました。</p><ul class="result-list">${domainRows}</ul>${rows.length?`<h2>間違えた問題</h2><ul class="result-list">${rows.join('')}</ul>`:'<p>全問正解です。</p>'}<button class="primary" id="reviewAgain" ${getMissed().length?'':'disabled'}>間違えた問題を復習（${getMissed().length}問）</button><button class="secondary" id="newTest">もう一度80問テスト</button></div>`;area.querySelector('#reviewAgain').addEventListener('click',loadWrong);area.querySelector('#newTest').addEventListener('click',beginTest)}
function finish(){progress.style.width='100%';count.textContent=`${items.length} / ${items.length}`;const rows=correctByDomain.filter(x=>x.total).map(x=>`<li><span>${x.name}</span><strong>${x.correct} / ${x.total}</strong></li>`).join('');const missedCount=getMissed().length;area.innerHTML=`<div class="result"><span class="tag">${reviewMode?'復習完了':'クイズ完了'}</span><h1>おつかれさまでした</h1><div class="score">${score} / ${items.length}</div><p>正解数です。分野別の結果を確認できます。</p>${rows?`<ul class="result-list">${rows}</ul>`:''}${missedCount?`<button class="primary" id="reviewAgain">間違えた問題を続けて復習（${missedCount}問）</button>`:''}<button class="secondary" id="retry">同じ範囲でもう一度</button></div>`;area.querySelector('#retry').addEventListener('click',load);area.querySelector('#reviewAgain')?.addEventListener('click',loadWrong)}
sel.addEventListener('change',load);reviewWrong.addEventListener('click',loadWrong);startTestButton.addEventListener('click',beginTest);resumeTestButton.addEventListener('click',resumeTest);updateReviewButton();updateResumeButton();load();
</script>
</body></html>
